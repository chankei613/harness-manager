name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: harness-manager-darwin-arm64
          - os: macos-13
            platform: darwin/amd64
            artifact: harness-manager-darwin-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: harness-manager-windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          zip -r ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/${{ matrix.artifact }}.zip
            build/bin/${{ matrix.artifact }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
